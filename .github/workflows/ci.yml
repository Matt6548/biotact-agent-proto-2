name: Martial Training Lab CI

on:
  push:
    branches:
      - martial-training-lab
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and produce lock
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance — desktop, mobile and fake camera
        run: npm run test:e2e

      - name: Commit tested dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/martial-training-lab'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock tested dependencies"
          git push origin HEAD:martial-training-lab

      - name: Upload QA and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martial-training-qa
          path: |
            test-results/
            package-lock.json
            public/models/pose_landmarker_lite.provenance.txt
          if-no-files-found: warn
          retention-days: 14
