name: Martial Training Lab CI

on:
  push:
    branches:
      - martial-training-lab
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance — desktop, mobile and fake camera
        run: npm run test:e2e

      - name: Upload QA and dependency lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martial-training-qa
          path: |
            test-results/
            package-lock.json
            public/models/pose_landmarker_lite.provenance.txt
          if-no-files-found: warn
          retention-days: 14
