name: CV hand runtime isolated QA
on:
  pull_request:
    branches: [integration/candle-v2-review-20261124, martial-training-lab]
    paths:
      - 'src/vision/**'
      - 'src/features/free-practice.js'
      - 'tests/hand*'
      - 'tests/hand-runtime/**'
      - 'playwright.hand.config.js'
      - '.github/workflows/cv-hand-runtime.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Unit tests with retained evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p hand-runtime-evidence
          npm test | tee hand-runtime-evidence/node-tests.log
      - name: Default app build
        id: default_build (Pose path, no hand model in default dist)
        run: npm run build
      - run: node scripts/prepare-hand-landmarker-assets.mjs
      - name: Download public official sample for isolated model test
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 60 https://storage.googleapis.com/mediapipe-tasks/gesture_recognizer/thumbs_up.jpg -o "$RUNNER_TEMP/hand-fixture.jpg"
          echo "2aee0e3a69ba5f0d3287597e61d265f4f3ac2a44ccec198dddd2639b0c8ef7ba  $RUNNER_TEMP/hand-fixture.jpg" | sha256sum -c -
          echo "HAND_FIXTURE_PATH=$RUNNER_TEMP/hand-fixture.jpg" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --config tests/hand-runtime/vite.config.js
      - run: npx playwright test --config playwright.hand.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-runtime-numeric-evidence
          path: |
            hand-runtime-evidence/*.json
            hand-runtime-evidence/node-tests.log
            public/models/hand_landmarker.provenance.txt
            public/mediapipe/hand-0.10.35/provenance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Existing camera and resilience browser regression (serial, focus-sensitive)
        if: always() && steps.default_build.outcome == 'success'
        run: npx playwright test --workers=1 --project=camera-chromium --project=camera-mobile-chromium --project=resilience-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-pose-regression-errors
          path: test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
